spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/ojttrack_dev
spring.datasource.username=ojttrack_user
spring.datasource.password=${DB_PASSWORD}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.jpa.hibernate.ddl-auto=validate
# MVP assumption: every student and company is in the Philippines (no daylight-saving time).
# Changing this only changes the ONE zone used for "today"; multi-timezone support would
# need a per-placement zone and timestamp-based logs (see TimeConfig).
ojttrack.time-zone=Asia/Manila
