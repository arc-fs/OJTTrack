# Used only by *DbTest classes (@ActiveProfiles("dbtest")).
# A separate database so tests never touch your development data.
# One-time setup in psql:  CREATE DATABASE ojttrack_test OWNER ojttrack_user;
spring.datasource.url=jdbc:postgresql://localhost:5432/ojttrack_test
spring.datasource.username=ojttrack_user
spring.datasource.password=${DB_PASSWORD}
